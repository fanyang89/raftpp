name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  FORMAT_IMAGE: ghcr.io/${{ github.repository_owner }}/clang-format:18

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build format image
        uses: ./.github/actions/build-format-image
        with:
          image: ${{ env.FORMAT_IMAGE }}

      - name: Check formatting
        run: task check-fmt

  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Run cppcheck
        run: task lint

  preflight:
    name: Smoke Test (Clang / build + tests)
    needs: [format-check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang llvm cmake git

      - name: Cache CPM dependencies
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.arch }}-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          cmake --preset=Coverage -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          ./build/tests/raftpp-tests
          ./build/tests/datadriven/data-driven-tests

  build-and-test-x64:
    name: "x64 / ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitizer && format(' / {0}', matrix.sanitizer) || '' }}"
    needs: [preflight]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        build_type: [Debug, Release]
        sanitizer: [address, thread, ""]
        exclude:
          - build_type: Release
            sanitizer: thread
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang g++ cmake git

      - name: Cache CPM dependencies
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.arch }}-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          TOOLCHAIN=cmake/${{ matrix.compiler }}-toolchain.cmake
          cmake --preset=${{ matrix.build_type }} \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
            ${{ matrix.sanitizer && format('-DRAFTPP_SANITIZE={0}', matrix.sanitizer) || '' }}

      - name: Build
        run: cmake --build build

      - name: Run Unit Tests
        run: ./build/tests/raftpp-tests

      - name: Run Data-Driven Tests
        run: ./build/tests/datadriven/data-driven-tests

  coverage:
    name: Coverage (Clang / llvm-cov)
    needs: [preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang llvm cmake git

      - name: Cache CPM dependencies
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.arch }}-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          cmake --preset=Coverage -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          LLVM_PROFILE_FILE: build/raftpp-%p.profraw
        run: |
          ./build/tests/raftpp-tests
          ./build/tests/datadriven/data-driven-tests

      - name: Generate coverage report
        run: |
          llvm-profdata merge -sparse build/*.profraw -o build/coverage.profdata
          llvm-cov export \
            ./build/tests/raftpp-tests -object ./build/tests/datadriven/data-driven-tests \
            -instr-profile=build/coverage.profdata \
            -format=lcov \
            -ignore-filename-regex='(tests|third_party|generated|\.pb\.)' \
            > build/coverage.lcov
          llvm-cov report \
            ./build/tests/raftpp-tests -object ./build/tests/datadriven/data-driven-tests \
            -instr-profile=build/coverage.profdata \
            -ignore-filename-regex='(tests|third_party|generated|\.pb\.)'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.lcov
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  build-and-test-arm64:
    name: "arm64 / ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.sanitizer && format(' / {0}', matrix.sanitizer) || '' }}"
    needs: [preflight]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        build_type: [Debug, Release]
        sanitizer: [address, thread, ""]
        exclude:
          - build_type: Release
            sanitizer: thread
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang g++ cmake git

      - name: Show runner details
        run: |
          uname -a
          clang --version
          gcc --version
          cmake --version
          ninja --version

      - name: Cache CPM dependencies
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.arch }}-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          TOOLCHAIN=cmake/${{ matrix.compiler }}-toolchain.cmake
          cmake --preset=${{ matrix.build_type == 'Debug' && 'Debug' || 'Release' }} \
            -B build \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
            ${{ matrix.sanitizer && format('-DRAFTPP_SANITIZE={0}', matrix.sanitizer) || '' }}

      - name: Build
        run: cmake --build build

      - name: Run Unit Tests
        run: ./build/tests/raftpp-tests

      - name: Run Data-Driven Tests
        run: ./build/tests/datadriven/data-driven-tests
