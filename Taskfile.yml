# https://taskfile.dev

version: "3"

dotenv:
  - .env

tasks:
  proto:
    desc: Generate C++ protobuf files from raftpp.proto
    aliases:
      - pb
    deps:
      - build-protoc
    cmds:
      - platforms: [linux, darwin]
        cmd: >
          ./build/_deps/protobuf-build/protoc
          -I proto
          --cpp_out=proto/generated/raftpp
          raftpp.proto

  fmt:
    desc: Format all C++ source files with clang-format
    platforms: [linux, darwin]
    cmds:
      - >
        find include lib tests -type f \( -name '*.cc' -o -name '*.h' -o -name '*.hpp' \)
        ! -path '*/generated/*' ! -name '*.pb.*'
        -exec clang-format --style=file -i {} +

  cmake:
    desc: Configure CMake with dev preset
    cmds:
      - cmake --preset=dev

  build:
    desc: Build all test targets
    deps:
      - cmake
    cmds:
      - cmake --build build --target raftpp-tests raftpp-datadriven-tests

  build-protoc:
    deps:
      - cmake
    cmds:
      - cmake --build build --target protoc

  test:
    desc: Build and run all tests
    deps:
      - build
    cmds:
      - task: unit-test
      - task: data-driven-test

  unit-test:
    desc: Run unit tests
    aliases:
      - ut
    cmds:
      - ./build/tests/raftpp-tests

  data-driven-test:
    desc: Run data-driven tests
    aliases:
      - dt
    cmds:
      - ./build/tests/datadriven/raftpp-datadriven-tests

  clean:
    desc: Clear the default build directory
    cmds:
      - rm -rf ./build
