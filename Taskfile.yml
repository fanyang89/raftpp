# https://taskfile.dev

version: "3"

dotenv:
  - .env

tasks:
  pb:
    desc: Generate C++ protobuf files from raftpp.proto
    cmds:
      - platforms: [windows]
        cmd: >
          protoc.exe
          -I proto
          --cpp_out=proto/generated/raftpp
          raftpp.proto

      - platforms:
          - darwin
          - linux
        cmd: >
          ./build/_deps/protobuf-build/protoc
          -I proto
          --cpp_out=proto/generated/raftpp
          raftpp.proto

  fmt:
    desc: Format all C++ source files with clang-format
    platforms: [linux]
    cmds:
      - >
        clang-format --style=file -i
        $(git ls-files | grep '.cc$\|.h$\|.hpp$' | grep -v 'sqlite3ext\.\|sqlite3\.\|\.pb\.\|generated')

  cmake:
    desc: Configure CMake with dev preset
    cmds:
      - cmake --preset=dev

  build:
    desc: Build all test targets
    cmds:
      - cmake --build build --target raftpp-tests raftpp-datadriven-tests

  build-protoc:
    cmds:
      - cmake --build build --target protoc

  test:
    desc: Run all tests
    deps:
      - build
    cmds:
      - ./build/tests/raftpp-tests
      - ./build/tests/datadriven/raftpp-datadriven-tests
