# https://taskfile.dev

version: "3"

dotenv:
  - .env

tasks:

  fmt:
    desc: Format all C++ source files with clang-format
    platforms: [linux, darwin]
    cmds:
      - >
        find include lib tests -type f \( -name '*.cc' -o -name '*.h' -o -name '*.hpp' \)
        ! -path '*/generated/*' ! -name '*.pb.*'
        -exec clang-format --style=file -i {} +

  check-fmt:
    desc: Check formatting without modifying files
    platforms: [linux, darwin]
    cmds:
      - >
        find include lib tests -type f \( -name '*.cc' -o -name '*.h' -o -name '*.hpp' \)
        ! -path '*/generated/*' ! -name '*.pb.*'
        -exec clang-format --style=file --dry-run --Werror {} +

  cmake:
    desc: Configure CMake with debug preset
    cmds:
      - cmake --preset=debug

  build:
    desc: Build all test targets
    deps:
      - cmake
    cmds:
      - cmake --build build --target raftpp-tests data-driven-tests

  test:
    desc: Build and run all tests
    deps:
      - build
    cmds:
      - task: unit-test
      - task: data-driven-test

  unit-test:
    desc: Run unit tests
    aliases:
      - ut
    cmds:
      - ./build/tests/raftpp-tests

  data-driven-test:
    desc: Run data-driven tests
    aliases:
      - dt
    cmds:
      - ./build/tests/datadriven/data-driven-tests

  gh-review:
    desc: Notify bot to review on the current PR
    cmds:
      - gh pr comment --body "@codex review"
      - gh pr comment --body "@gemini-code-assist review"

  rdma-test:
    desc: Run RDMA transport tests (set RDMA_ADDR1/RDMA_ADDR2)
    deps:
      - build
    preconditions:
      - sh: test -n "{{.RDMA_ADDR1}}"
        msg: "Set RDMA_ADDR1, e.g. task rdma-test RDMA_ADDR1=10.0.0.1:19100 RDMA_ADDR2=10.0.0.2:19101"
      - sh: test -n "{{.RDMA_ADDR2}}"
        msg: "Set RDMA_ADDR2, e.g. task rdma-test RDMA_ADDR1=10.0.0.1:19100 RDMA_ADDR2=10.0.0.2:19101"
    env:
      RAFTPP_RDMA_TEST: "1"
      RAFTPP_RDMA_ADDR1: "{{.RDMA_ADDR1}}"
      RAFTPP_RDMA_ADDR2: "{{.RDMA_ADDR2}}"
    cmds:
      - ./build/tests/raftpp-tests "rpc::rdma*"

  clean:
    desc: Clear the default build directory
    cmds:
      - rm -rf ./build

  coverage:
    desc: Get unit test coverage report (using llvm-cov)
    env:
      LLVM_PROFILE_FILE: build/raftpp-%p.profraw
    vars:
      PROF_DATA: build/coverage.profdata
    cmds:
      # build
      - cmake --preset=relwithdebinfo -DRAFTPP_COVERAGE=ON -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake}
      - ninja -C build
      # clear and re-built coverage data
      - rm -f build/*.profraw {{.PROF_DATA}}
      - ./build/tests/raftpp-tests
      # merge coverage data
      - llvm-profdata merge -sparse build/*.profraw -o {{.PROF_DATA}}
      - >
        llvm-cov show
        ./build/tests/raftpp-tests
        -instr-profile={{.PROF_DATA}}
        -format=html
        -output-dir=build/coverage-report
        -ignore-filename-regex='(tests|third_party|generated|\.pb\.)'
        -show-instantiations=false
      - echo "Coverage report generated at build/coverage-report/index.html"

  install-tools:
    desc: Install third-party tools
    cmds:
      - cargo install grcov

  lint:
    desc: Run lint tools
    cmds:
      - cppcheck include lib

  analyze:
    desc: Run clang static analyzer using scan-build
    cmds:
      - rm -rf build
      - cmake --preset=debug -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake}
      - >
        scan-build
        -enable-checker core
        -enable-checker cplusplus
        -enable-checker deadcode
        -enable-checker security
        -enable-checker unix
        -enable-checker optin.core.EnumCastOutOfRange
        -enable-checker optin.cplusplus.UninitializedObject
        -enable-checker optin.cplusplus.VirtualCall
        -enable-checker optin.performance.Padding
        -enable-checker optin.taint.GenericTaint
        -enable-checker alpha.core.Conversion
        -enable-checker alpha.core.PointerArithm
        -enable-checker alpha.cplusplus.InvalidatedIterator
        -enable-checker alpha.cplusplus.IteratorRange
        -enable-checker alpha.unix.PthreadLock
        -enable-checker alpha.deadcode.UnreachableCode
        ninja -C build
