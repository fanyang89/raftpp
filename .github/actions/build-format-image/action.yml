name: Build Format Image
description: Build the clang-format image and optionally publish it to GHCR.

inputs:
  image:
    description: OCI image reference to build.
    required: true
  push:
    description: Push the image to the registry instead of loading it locally.
    required: false
    default: "false"
  github-token:
    description: Token used for GHCR login when push is enabled.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build format image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: ${{ inputs.push != 'true' }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
