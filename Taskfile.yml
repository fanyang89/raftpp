# https://taskfile.dev

version: "3"

dotenv:
  - .env

tasks:
  proto:
    desc: Generate C++ protobuf files from raftpp.proto
    aliases:
      - pb
    deps:
      - build-protoc
    cmds:
      - platforms: [linux, darwin]
        cmd: >
          ./build/_deps/protobuf-build/protoc
          -I proto
          --cpp_out=proto/generated/raftpp/core
          raftpp.proto

  fmt:
    desc: Format all C++ source files with clang-format
    platforms: [linux, darwin]
    cmds:
      - >
        find include lib tests -type f \( -name '*.cc' -o -name '*.h' -o -name '*.hpp' \)
        ! -path '*/generated/*' ! -name '*.pb.*'
        -exec clang-format --style=file -i {} +
      - >
        uvx --from cmakelang cmake-format
        --line-width 100
        --command-case canonical
        --keyword-case upper
        --enable-markup false
        --separate-ctrl-name-with-space true
        --dangle-align prefix-indent
        -i
        CMakeLists.txt
        lib/CMakeLists.txt
        lib/core/CMakeLists.txt
        lib/raftor/CMakeLists.txt
        lib/raftor/rpc/CMakeLists.txt
        lib/raftor/wal/CMakeLists.txt
        proto/CMakeLists.txt
        tests/CMakeLists.txt
        tests/datadriven/CMakeLists.txt
        tests/harness/CMakeLists.txt
        third_party/CMakeLists.txt

  cmake:
    desc: Configure CMake with dev preset
    cmds:
      - cmake --preset=dev

  build:
    desc: Build all test targets
    deps:
      - cmake
    cmds:
      - cmake --build build --target raftpp-tests raftpp-datadriven-tests

  build-protoc:
    deps:
      - cmake
    cmds:
      - cmake --build build --target protoc

  test:
    desc: Build and run all tests
    deps:
      - build
    cmds:
      - task: unit-test
      - task: data-driven-test

  unit-test:
    desc: Run unit tests
    aliases:
      - ut
    cmds:
      - ./build/tests/raftpp-tests

  data-driven-test:
    desc: Run data-driven tests
    aliases:
      - dt
    cmds:
      - ./build/tests/datadriven/raftpp-datadriven-tests

  clean:
    desc: Clear the default build directory
    cmds:
      - rm -rf ./build

  coverage:
    desc: Get unit test coverage report (using llvm-cov)
    env:
      LLVM_PROFILE_FILE: build-coverage/raftpp-%p.profraw
    vars:
      PROF_DATA: build-coverage/coverage.profdata
    cmds:
      # build
      - cmake --preset=coverage
      - ninja -C build-coverage
      # clear and re-built coverage data
      - rm -f build-coverage/*.profraw {{.PROF_DATA}}
      - ./build-coverage/tests/raftpp-tests
      # merge coverage data
      - llvm-profdata merge -sparse build-coverage/*.profraw -o {{.PROF_DATA}}
      - >
        llvm-cov show
        ./build-coverage/tests/raftpp-tests
        -instr-profile={{.PROF_DATA}}
        -format=html
        -output-dir=build-coverage/coverage-report
        -ignore-filename-regex='(tests|third_party|generated|\.pb\.)'
        -show-instantiations=false
      - echo "Coverage report generated at build-coverage/coverage-report/index.html"

  install-tools:
    desc: Install third-party tools
    cmds:
      - cargo install grcov

  lint:
    desc: Run lint tools
    cmds:
      - cppcheck include lib

  analyze:
    desc: Run clang static analyzer using scan-build
    cmds:
      - rm -rf build-clang
      - cmake --preset=clang
      - >
        scan-build
        -enable-checker core
        -enable-checker cplusplus
        -enable-checker deadcode
        -enable-checker security
        -enable-checker unix
        -enable-checker optin.core.EnumCastOutOfRange
        -enable-checker optin.cplusplus.UninitializedObject
        -enable-checker optin.cplusplus.VirtualCall
        -enable-checker optin.performance.Padding
        -enable-checker optin.taint.GenericTaint
        -enable-checker alpha.core.Conversion
        -enable-checker alpha.core.PointerArithm
        -enable-checker alpha.cplusplus.InvalidatedIterator
        -enable-checker alpha.cplusplus.IteratorRange
        -enable-checker alpha.unix.PthreadLock
        -enable-checker alpha.deadcode.UnreachableCode
        ninja -C build-clang
