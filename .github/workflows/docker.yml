name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
      - .github/actions/build-format-image/action.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
      - .github/actions/build-format-image/action.yml

env:
  FORMAT_IMAGE: ghcr.io/${{ github.repository_owner }}/clang-format:18

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build or publish format image
        uses: ./.github/actions/build-format-image
        with:
          image: ${{ env.FORMAT_IMAGE }}
          push: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
