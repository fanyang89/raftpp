# https://taskfile.dev

version: "3"

dotenv:
  - .env

tasks:
  docker-build:
    desc: Build the format image
    cmds:
      - docker build -t "${FORMAT_IMAGE:-ghcr.io/raftpp/clang-format:18}" .

  fmt:
    desc: Format all C++ source files with clang-format (via Docker)
    platforms: [linux, darwin]
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "docker is required. Run 'task docker-build' first."
    cmds:
      - ./scripts/clang-format.sh fmt

  check-fmt:
    desc: Check formatting without modifying files (via Docker)
    platforms: [linux, darwin]
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: "docker is required. Run 'task docker-build' first."
    cmds:
      - ./scripts/clang-format.sh check

  cmake:
    desc: Configure CMake with debug preset
    cmds:
      - cmake --preset=Debug -B build

  build:
    desc: Build all test targets
    deps:
      - cmake
    cmds:
      - cmake --build build --target raftpp-tests data-driven-tests

  test:
    desc: Build and run all tests
    deps:
      - build
    cmds:
      - task: unit-test
      - task: data-driven-test

  unit-test:
    desc: Run unit tests
    aliases:
      - ut
    cmds:
      - ./build/tests/raftpp-tests

  unit-test-asan:
    desc: Build and run unit tests with ASan
    cmds:
      - cmake --preset=Debug -B build-asan -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake} -DRAFTPP_SANITIZE=address
      - cmake --build build-asan --target raftpp-tests
      - ./build-asan/tests/raftpp-tests

  unit-test-tsan:
    desc: Build and run unit tests with TSan
    cmds:
      - cmake --preset=Debug -B build-tsan -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake} -DRAFTPP_SANITIZE=thread
      - cmake --build build-tsan --target raftpp-tests
      - ./build-tsan/tests/raftpp-tests

  unit-test-release:
    desc: Build and run unit tests with release preset
    cmds:
      - cmake --preset=Release -B build-release -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake}
      - cmake --build build-release --target raftpp-tests
      - ./build-release/tests/raftpp-tests

  unit-test-all:
    desc: Build and run ASan, TSan, and release unit tests
    aliases:
      - ut-all
    cmds:
      - task: unit-test-asan
      - task: unit-test-tsan
      - task: unit-test-release

  data-driven-test:
    desc: Run data-driven tests
    aliases:
      - dt
    cmds:
      - ./build/tests/datadriven/data-driven-tests

  gh-review:
    desc: Notify bot to review on the current PR
    cmds:
      - gh pr comment --body "@codex review"
      - gh pr comment --body "@gemini-code-assist review"

  clean:
    desc: Clear the default build directory
    cmds:
      - rm -rf ./build

  coverage:
    desc: Get unit test coverage report (using llvm-cov)
    env:
      LLVM_PROFILE_FILE: build/raftpp-%p.profraw
    vars:
      PROF_DATA: build/coverage.profdata
    cmds:
      # build
      - cmake --preset=RelWithDebInfo -B build -DRAFTPP_COVERAGE=ON -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake}
      - ninja -C build
      # clear and re-built coverage data
      - rm -f build/*.profraw {{.PROF_DATA}}
      - ./build/tests/raftpp-tests
      # merge coverage data
      - llvm-profdata merge -sparse build/*.profraw -o {{.PROF_DATA}}
      - >
        llvm-cov show
        ./build/tests/raftpp-tests
        -instr-profile={{.PROF_DATA}}
        -format=html
        -output-dir=build/coverage-report
        -ignore-filename-regex='(tests|third_party|generated|\.pb\.)'
        -show-instantiations=false
      - echo "Coverage report generated at build/coverage-report/index.html"

  install-tools:
    desc: Install third-party tools
    cmds:
      - cargo install grcov

  lint:
    desc: Run lint tools
    cmds:
      - cppcheck include lib

  analyze:
    desc: Run clang static analyzer using scan-build
    cmds:
      - rm -rf build
      - cmake --preset=Debug -B build -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN:-cmake/clang-toolchain.cmake}
      - >
        scan-build
        -enable-checker core
        -enable-checker cplusplus
        -enable-checker deadcode
        -enable-checker security
        -enable-checker unix
        -enable-checker optin.core.EnumCastOutOfRange
        -enable-checker optin.cplusplus.UninitializedObject
        -enable-checker optin.cplusplus.VirtualCall
        -enable-checker optin.performance.Padding
        -enable-checker optin.taint.GenericTaint
        -enable-checker alpha.core.Conversion
        -enable-checker alpha.core.PointerArithm
        -enable-checker alpha.cplusplus.InvalidatedIterator
        -enable-checker alpha.cplusplus.IteratorRange
        -enable-checker alpha.unix.PthreadLock
        -enable-checker alpha.deadcode.UnreachableCode
        ninja -C build
